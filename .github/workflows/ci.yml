name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ==============================================================================
  # 1. Backend Verification Gate (Go 1.26)
  # ==============================================================================
  backend-ci:
    name: Backend CI (Format, Build, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go code formatting
        run: |
          UNFORMATTED=$(gofmt -l backend/)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Compile backend packages
        run: |
          cd backend
          go build -v ./...

      - name: Execute automated test suite
        run: |
          cd backend
          go test -v -race ./...

  # ==============================================================================
  # 2. Frontend Verification Gate (Node 22, pnpm 10)
  # ==============================================================================
  frontend-ci:
    name: Frontend CI (Install, Typecheck, Lint, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Static type check (tsc)
        run: |
          cd frontend
          pnpm exec tsc --noEmit

      - name: Code linting
        run: |
          cd frontend
          pnpm lint

      - name: Build production bundle
        run: |
          cd frontend
          pnpm build

  # ==============================================================================
  # 3. Containerization Verification Gate (Docker Multi-Stage Builds)
  # ==============================================================================
  docker-build-ci:
    name: Docker Build CI (Multi-Stage Images)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: dashstack-backend:ci

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: dashstack-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
